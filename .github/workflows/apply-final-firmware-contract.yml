name: Apply final firmware contract patch

on:
  push:
    branches:
      - fix/firmware-lua-safety-current

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply final source changes
        shell: python
        run: |
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text(encoding="utf-8")

          def write(path, text):
              Path(path).write_text(text, encoding="utf-8")

          def replace_once(text, old, new, label):
              if text.count(old) != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {text.count(old)}")
              return text.replace(old, new, 1)

          def regex_once(text, pattern, replacement, label):
              result, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one regex match, found {count}")
              return result

          fw_path = "PPBControllerLib/include/firmwareupdater.cpp"
          fw = read(fw_path)
          fw = replace_once(fw, "\n#include <limits>\n", "\n", "remove limits include")
          fw = replace_once(fw, "    quint32 addressBase = 0;\n    quint64 expectedNextAddress = 0;\n", "", "remove address state")
          fw = regex_once(fw, r"        case 0x00: \{ // Data\n.*?            break;\n        \}\n\n        case 0x01:", "        case 0x00: { // Data\n            // PPB firmware transport intentionally ignores Intel HEX addresses.\n            // The host validates record structure/checksums and forwards DATA\n            // bytes in file order; the MCU reconstructs/programs the image.\n            if (!recordData.isEmpty()) {\n                int offset = 0;\n                while (offset < recordData.size()) {\n                    const int chunkSize = qMin(16, recordData.size() - offset);\n                    dataBlocks.append(recordData.mid(offset, chunkSize));\n                    offset += chunkSize;\n                }\n                dataSeen = true;\n            }\n            break;\n        }\n\n        case 0x01:", "linear DATA records")
          fw = regex_once(fw, r"        case 0x02: \{ // Extended Segment Address\n.*?            break;\n        \}\n\n        case 0x03:", "        case 0x02: // Extended Segment Address\n            if (!requireControlRecord(recordData, 2, recordAddress, lineNumber,\n                                      \"Extended Segment Address\")) {\n                dataBlocks.clear();\n                return dataBlocks;\n            }\n            // Address metadata is intentionally not interpreted by the host.\n            break;\n\n        case 0x03:", "ignore segment address metadata")
          fw = regex_once(fw, r"        case 0x04: \{ // Extended Linear Address\n.*?            break;\n        \}\n\n        case 0x05:", "        case 0x04: // Extended Linear Address\n            if (!requireControlRecord(recordData, 2, recordAddress, lineNumber,\n                                      \"Extended Linear Address\")) {\n                dataBlocks.clear();\n                return dataBlocks;\n            }\n            // Address metadata is intentionally not interpreted by the host.\n            break;\n\n        case 0x05:", "ignore linear address metadata")
          write(fw_path, fw)

          test_path = "PPBControllerLib/tests/firmwareupdater_test.cpp"
          test = read(test_path)
          test = replace_once(test, "    void rejectsGap();\n    void rejectsOverlapOrOutOfOrder();\n", "    void acceptsGapAsLinearStream();\n    void acceptsOutOfOrderAsLinearStream();\n", "rename address tests")
          test = regex_once(test, r"void FirmwareUpdaterTest::rejectsGap\(\)\n\{.*?\n\}\n\nvoid FirmwareUpdaterTest::rejectsOverlapOrOutOfOrder\(\)\n\{.*?\n\}\n\n(?=void FirmwareUpdaterTest::rejectsBadChecksum)", "void FirmwareUpdaterTest::acceptsGapAsLinearStream()\n{\n    QTemporaryDir dir;\n    QVERIFY(dir.isValid());\n\n    const QByteArray first = QByteArray::fromHex(\"01020304\");\n    const QByteArray second = QByteArray::fromHex(\"05060708\");\n    const QString path = writeHex({\n        makeRecord(0x1000, 0x00, first),\n        makeRecord(0x1008, 0x00, second),\n        makeRecord(0x0000, 0x01, {})\n    }, dir);\n\n    const auto blocks = FirmwareUpdater::parseHexToDataBlocks(path);\n    QVERIFY(!blocks.isEmpty());\n    QCOMPARE(flatten(blocks), first + second);\n}\n\nvoid FirmwareUpdaterTest::acceptsOutOfOrderAsLinearStream()\n{\n    QTemporaryDir dir;\n    QVERIFY(dir.isValid());\n\n    const QByteArray firstInFile = QByteArray::fromHex(\"01020304\");\n    const QByteArray secondInFile = QByteArray::fromHex(\"05060708\");\n    const QString path = writeHex({\n        makeRecord(0x2000, 0x00, firstInFile),\n        makeRecord(0x1000, 0x00, secondInFile),\n        makeRecord(0x0000, 0x01, {})\n    }, dir);\n\n    const auto blocks = FirmwareUpdater::parseHexToDataBlocks(path);\n    QVERIFY(!blocks.isEmpty());\n    QCOMPARE(flatten(blocks), firstInFile + secondInFile);\n}\n\n", "rewrite address tests")
          write(test_path, test)

          ctl_path = "PPBControllerLib/src/ppbcontrollerlib.cpp"
          ctl = read(ctl_path)
          ctl = replace_once(ctl, "    // 1. Validate and linearize Intel HEX. The parser rejects gaps,\n    // overlaps and out-of-order records because VOLUME carries no address.\n", "    // 1. Validate Intel HEX records and linearize DATA bytes in file order.\n    // Flash-address interpretation belongs to the MCU, not to the host VOLUME transport.\n", "firmware parser contract comment")
          old_is_you = "        auto conn = connect(m_communication, &ICommunication::commandDataParsed,\n                            [&](uint16_t addr, const QVariant& data, TechCommand cmd) {\n                                if (cmd == TechCommand::IS_YOU && addr == 0) {\n                                    activeMask = data.toMap()[\"mask\"].toUInt();\n                                    loop.quit();\n                                }\n                            });\n"
          new_is_you = "        auto conn = connect(m_communication, &ICommunication::commandDataParsed,\n                            this,\n                            [&](uint16_t addr, const QVariant& data, TechCommand cmd) {\n                                if (cmd == TechCommand::IS_YOU && addr == 0) {\n                                    activeMask = data.toMap()[\"mask\"].toUInt();\n                                    loop.quit();\n                                }\n                            },\n                            Qt::QueuedConnection);\n"
          ctl = replace_once(ctl, old_is_you, new_is_you, "IS_YOU callback context")
          old_volume = "        auto conn = connect(m_communication, &ICommunication::commandCompleted,\n                            [&](bool ok, const QString& msg, TechCommand cmd) {\n                                if (cmd == TechCommand::VOLUME) {\n                                    success = ok;\n                                    errorMsg = msg;\n                                    loop.quit();\n                                }\n                            });\n"
          new_volume = "        auto conn = connect(m_communication, &ICommunication::commandCompleted,\n                            this,\n                            [&](bool ok, const QString& msg, TechCommand cmd) {\n                                if (cmd == TechCommand::VOLUME) {\n                                    success = ok;\n                                    errorMsg = msg;\n                                    loop.quit();\n                                }\n                            },\n                            Qt::QueuedConnection);\n"
          if ctl.count(old_volume) != 2:
              raise SystemExit(f"VOLUME callback context: expected 2 matches, found {ctl.count(old_volume)}")
          ctl = ctl.replace(old_volume, new_volume)
          old_group = "    auto conn = connect(m_communication, &ICommunication::groupCommandCompleted,\n                        [&](quint64 id, bool success, const QString& msg) {\n                            if (id == groupId) {\n                                allSuccess = success;\n                                summary = msg;\n                                loop.quit();\n                            }\n                        });\n"
          new_group = "    auto conn = connect(m_communication, &ICommunication::groupCommandCompleted,\n                        this,\n                        [&](quint64 id, bool success, const QString& msg) {\n                            if (id == groupId) {\n                                allSuccess = success;\n                                summary = msg;\n                                loop.quit();\n                            }\n                        },\n                        Qt::QueuedConnection);\n"
          ctl = replace_once(ctl, old_group, new_group, "legacy group callback context")
          write(ctl_path, ctl)

      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PPBControllerLib/include/firmwareupdater.cpp \
                  PPBControllerLib/src/ppbcontrollerlib.cpp \
                  PPBControllerLib/tests/firmwareupdater_test.cpp
          git diff --cached --check
          git commit -m 'fix: align firmware host with MCU-owned addressing'
          git push origin HEAD:fix/firmware-lua-safety-current

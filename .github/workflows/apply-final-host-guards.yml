name: Apply final host safety guards

on:
  push:
    branches:
      - fix/firmware-lua-safety-current

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply final guards and drop unrelated legacy-test edits
        shell: python
        run: |
          from pathlib import Path

          p = Path('PPBControllerLib/src/ppbcontrollerlib.cpp')
          text = p.read_text(encoding='utf-8')

          replacements = [
              (
                  '''void PPBController::disconnect()\n{\n    if (m_communication) {''',
                  '''void PPBController::disconnect()\n{\n    if (commandBlockedByFirmwareUpdate("disconnect")) return;\n    if (m_communication) {''',
                  'disconnect guard'
              ),
              (
                  '''void PPBController::startAutoPoll(int intervalMs)\n{\n    m_autoPollEnabled = true;''',
                  '''void PPBController::startAutoPoll(int intervalMs)\n{\n    if (commandBlockedByFirmwareUpdate("startAutoPoll")) return;\n    m_autoPollEnabled = true;''',
                  'auto-poll guard'
              ),
              (
                  '''void PPBController::requestVolume(uint16_t address, const QString& hexFilePath, float newVersion)\n{\n\n    if (m_communication) {\n        updateFirmware(address, hexFilePath, newVersion);\n        //m_communication->executeCommand(TechCommand::VOLUME, address);\n        LOG_UI_OPERATION(QString("Отправка тома ПО ППБ %1").arg(address));\n    }\n}''',
                  '''void PPBController::requestVolume(uint16_t address, const QString& hexFilePath, float newVersion)\n{\n    if (m_communication) {\n        // updateFirmware() owns validation, exclusivity and all progress/error\n        // reporting. Do not log a successful send here if preflight rejects it.\n        updateFirmware(address, hexFilePath, newVersion);\n    }\n}''',
                  'requestVolume truthful status'
              ),
          ]

          for old, new, label in replacements:
              if old in text:
                  text = text.replace(old, new, 1)
              elif new not in text:
                  raise RuntimeError(f'anchor not found: {label}')

          p.write_text(text, encoding='utf-8')

      - name: Restore unrelated legacy test files from master
        run: |
          git fetch origin master
          git checkout origin/master -- \
            PPBCommunicationLib/CMakeLists.txt \
            PPBCommunicationLib/tests/testengine.cpp

      - name: Validate and commit
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PPBControllerLib/src/ppbcontrollerlib.cpp PPBCommunicationLib/CMakeLists.txt PPBCommunicationLib/tests/testengine.cpp
          git commit -m "fix: close remaining host firmware interleaving paths"
          git push origin HEAD:fix/firmware-lua-safety-current

name: Port core fixes

on:
  push:
    branches:
      - fix/firmware-lua-safety-current

permissions:
  contents: write

jobs:
  port:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Port reviewed source fixes from previous fix branch
        run: |
          git fetch origin fix/firmware-lua-safety
          git checkout origin/fix/firmware-lua-safety -- \
            PPBCommunicationLib/src/communicationengine.cpp \
            PPBCommunicationLib/src/communicationengine.h \
            PPBCommunicationLib/src/communicationfacade.cpp \
            PPBControllerLib/include/firmwareupdater.cpp \
            PPBControllerLib/src/ppbcontrollerlib.cpp \
            PPB_GUI_Sandbox/fuwidget.cpp \
            ScenarioModule/scenarioengine.cpp \
            ScenarioModule/scenarioengine.h

          git diff --check
          git status --short

      - name: Commit source-only port
        run: |
          if git diff --cached --quiet; then
            echo "Nothing to port"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: port firmware communication and Lua safety fixes"
          git push origin HEAD:fix/firmware-lua-safety-current

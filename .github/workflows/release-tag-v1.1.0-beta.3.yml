name: Create release tag v1.1.0-beta.3

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/release-tag-v1.1.0-beta.3.yml'

permissions:
  contents: write
  actions: write

jobs:
  create-and-dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate VERSION, create tag, dispatch Windows release build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          if [[ "$version" != "1.1.0-beta.3" ]]; then
            echo "Expected VERSION=1.1.0-beta.3; got $version" >&2
            exit 1
          fi

          tag="v${version}"
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "Refusing to overwrite existing tag ${tag}" >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" "$GITHUB_SHA" -m "PPB ${version}"
          git push origin "refs/tags/${tag}"

          # GitHub does not trigger other workflows from GITHUB_TOKEN tag pushes.
          # An explicit workflow_dispatch on the *tag* is required.
          gh workflow run windows-installer.yml --ref "$tag"

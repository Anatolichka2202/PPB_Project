name: Validate firmware safety fixes

on:
  push:
    branches:
      - fix/firmware-lua-safety-current

jobs:
  linux-production-and-hex-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake \
            ninja-build \
            g++ \
            qt6-base-dev \
            qt6-charts-dev \
            liblua5.4-dev

      - name: Configure production build
        run: cmake -S . -B build-prod -G Ninja -DBUILD_TESTS=OFF -DCMAKE_BUILD_TYPE=Release

      - name: Build production
        run: cmake --build build-prod --parallel 2

      - name: Configure safety-test build
        run: cmake -S . -B build-test -G Ninja -DBUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Debug

      - name: Build Intel HEX safety test only
        run: cmake --build build-test --target test_firmwareupdater --parallel 2

      - name: Run Intel HEX safety test only
        run: ctest --test-dir build-test -R '^FirmwareUpdaterTest$' --output-on-failure

  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt 6.8.0 + MinGW 13.1
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.0'
          host: windows
          target: desktop
          arch: win64_mingw
          modules: 'qtcharts'
          tools: 'tools_mingw1310'
          cache: true

      - name: Install Ninja and NSIS
        shell: powershell
        run: choco install ninja nsis -y --no-progress

      - name: Configure release build
        shell: powershell
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTS=OFF
          -DPPB_FETCH_LUA_IF_MISSING=ON

      - name: Build
        shell: powershell
        run: cmake --build build --parallel 2

      - name: Build NSIS installer
        shell: powershell
        run: cmake --build build --target package

      - name: Verify and silent-install package
        shell: powershell
        run: |
          $installer = Get-ChildItem -Path build -Recurse -Filter 'PPB-*-Windows-x86_64.exe' | Select-Object -First 1
          if (-not $installer) { throw 'Installer not found.' }

          $installDir = Join-Path $env:RUNNER_TEMP 'PPB-Smoke'
          if (Test-Path $installDir) { Remove-Item -Recurse -Force $installDir }

          $p = Start-Process -FilePath $installer.FullName -ArgumentList "/S", "/D=$installDir" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Install failed: $($p.ExitCode)" }

          $requiredFiles = @(
            'PPB_GUI_Sandbox.exe',
            'Qt6Core.dll',
            'Qt6Gui.dll',
            'Qt6Widgets.dll',
            'Qt6Network.dll',
            'plugins/platforms/qwindows.dll'
          )
          foreach ($relativePath in $requiredFiles) {
            if (-not (Test-Path (Join-Path $installDir $relativePath))) {
              throw "Installed runtime is incomplete: missing $relativePath"
            }
          }

      - name: Smoke-run installed application
        shell: powershell
        run: |
          $installDir = Join-Path $env:RUNNER_TEMP 'PPB-Smoke'
          $app = Join-Path $installDir 'PPB_GUI_Sandbox.exe'
          $run = Start-Process -FilePath $app -ArgumentList '--test' -WorkingDirectory $installDir -PassThru
          Start-Sleep -Seconds 5
          $run.Refresh()
          if ($run.HasExited) { throw "Application exited: $($run.ExitCode)" }
          Stop-Process -Id $run.Id -Force

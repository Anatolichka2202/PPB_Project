name: Windows installer

on:
  workflow_dispatch:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-installer:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt 6.8.0 + MinGW 13.1
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.0'
          host: windows
          target: desktop
          arch: win64_mingw
          modules: 'qtcharts'
          tools: 'tools_mingw1310'
          cache: true

      - name: Install Ninja and NSIS
        shell: powershell
        run: choco install ninja nsis -y --no-progress

      - name: Toolchain diagnostics
        shell: powershell
        run: |
          g++ --version
          cmake --version
          ninja --version
          qmake --version

      - name: Configure release build
        shell: powershell
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTS=OFF
          -DPPB_FETCH_LUA_IF_MISSING=ON

      - name: Build
        shell: powershell
        run: cmake --build build --parallel 2

      - name: Build NSIS installer
        shell: powershell
        run: cmake --build build --target package

      - name: Verify installer artifact
        shell: powershell
        run: |
          $installer = Get-ChildItem -Path build -Recurse -Filter 'PPB-*-Windows-x86_64.exe' | Select-Object -First 1
          if (-not $installer) {
            throw 'CPack completed but no PPB Windows installer was found.'
          }
          Write-Host "Installer: $($installer.FullName)"
          Write-Host "Size: $($installer.Length) bytes"

      - name: Smoke-test silent install and deployed runtime
        shell: powershell
        run: |
          $installer = Get-ChildItem -Path build -Recurse -Filter 'PPB-*-Windows-x86_64.exe' | Select-Object -First 1
          if (-not $installer) {
            throw 'Installer not found for smoke test.'
          }

          $installDir = Join-Path $env:RUNNER_TEMP 'PPB-Smoke'
          if (Test-Path $installDir) {
            Remove-Item -Recurse -Force $installDir
          }

          $installProcess = Start-Process -FilePath $installer.FullName -ArgumentList "/S", "/D=$installDir" -Wait -PassThru
          if ($installProcess.ExitCode -ne 0) {
            throw "NSIS silent install failed with exit code $($installProcess.ExitCode)."
          }

          $requiredFiles = @(
            'PPB_GUI_Sandbox.exe',
            'Qt6Core.dll',
            'Qt6Gui.dll',
            'Qt6Widgets.dll',
            'Qt6Network.dll',
            'libgcc_s_seh-1.dll',
            'libstdc++-6.dll',
            'libwinpthread-1.dll',
            'plugins/platforms/qwindows.dll'
          )

          foreach ($relativePath in $requiredFiles) {
            $fullPath = Join-Path $installDir $relativePath
            if (-not (Test-Path $fullPath)) {
              throw "Installed runtime is incomplete: missing $relativePath"
            }
          }

          Write-Host "Silent install verified at $installDir"

      - name: Smoke-run installed application in test mode
        shell: powershell
        run: |
          $installDir = Join-Path $env:RUNNER_TEMP 'PPB-Smoke'
          $app = Join-Path $installDir 'PPB_GUI_Sandbox.exe'
          $process = Start-Process -FilePath $app -ArgumentList '--test' -WorkingDirectory $installDir -PassThru
          Start-Sleep -Seconds 5
          $process.Refresh()
          if ($process.HasExited) {
            throw "Installed PPB exited during smoke test with code $($process.ExitCode)."
          }
          Stop-Process -Id $process.Id -Force
          Write-Host 'Installed PPB stayed alive for the smoke-test interval.'

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: PPB-Windows-Installer
          path: build/PPB-*-Windows-x86_64.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish v1.01-beta GitHub Release
        if: "github.ref == 'refs/heads/master' && github.event.head_commit.message == 'release: publish v1.01-beta'"
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $installer = Get-ChildItem -Path build -Recurse -Filter 'PPB-*-Windows-x86_64.exe' | Select-Object -First 1
          if (-not $installer) {
            throw 'Installer not found for GitHub Release.'
          }

          $hash = (Get-FileHash -Algorithm SHA256 $installer.FullName).Hash.ToLower()
          $checksumPath = Join-Path $PWD 'build/SHA256SUMS.txt'
          "$hash  $($installer.Name)" | Set-Content -Path $checksumPath -Encoding ascii

          $notes = @"
          Windows installer for PPB 1.01 beta.

          CI verification:
          - clean Windows build: PASS
          - NSIS package generation: PASS
          - silent installation: PASS
          - Qt/MinGW runtime layout checks: PASS
          - installed application startup in --test mode: PASS

          Hardware note: CH375 USB support requires the official WCH runtime/driver (CH375DLL64.dll is not redistributed in this repository).
          "@

          gh release create 'v1.01-beta' $installer.FullName $checksumPath `
            --repo $env:GITHUB_REPOSITORY `
            --target '5fb6317a0e2e5bcffb89bcb85b0425beec5b6a1e' `
            --title 'PPB 1.01 beta' `
            --notes $notes `
            --prerelease

name: Windows installer

on:
  workflow_dispatch:
  pull_request:
    branches:
      - master
  push:
    tags:
      - 'v*'

jobs:
  build-installer:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt 6.8.0 + MinGW 13.1
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.0'
          host: windows
          target: desktop
          arch: win64_mingw
          modules: 'qtcharts'
          tools: 'tools_mingw1310'
          cache: true

      - name: Install Ninja and NSIS
        shell: powershell
        run: choco install ninja nsis -y --no-progress

      - name: Toolchain diagnostics
        shell: powershell
        run: |
          g++ --version
          cmake --version
          ninja --version
          qmake --version

      - name: Configure release build
        shell: powershell
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTS=OFF
          -DPPB_FETCH_LUA_IF_MISSING=ON

      - name: Build
        shell: powershell
        run: cmake --build build --parallel 2

      - name: Build NSIS installer
        shell: powershell
        run: cmake --build build --target package

      - name: Verify installer artifact
        shell: powershell
        run: |
          $installer = Get-ChildItem -Path build -Recurse -Filter 'PPB-*-Windows-x86_64.exe' | Select-Object -First 1
          if (-not $installer) {
            throw 'CPack completed but no PPB Windows installer was found.'
          }
          Write-Host "Installer: $($installer.FullName)"
          Write-Host "Size: $($installer.Length) bytes"

      - name: Smoke-test silent install and deployed runtime
        shell: powershell
        run: |
          $installer = Get-ChildItem -Path build -Recurse -Filter 'PPB-*-Windows-x86_64.exe' | Select-Object -First 1
          if (-not $installer) {
            throw 'Installer not found for smoke test.'
          }

          $installDir = Join-Path $env:RUNNER_TEMP 'PPB-Smoke'
          if (Test-Path $installDir) {
            Remove-Item -Recurse -Force $installDir
          }

          $installProcess = Start-Process `
            -FilePath $installer.FullName `
            -ArgumentList "/S", "/D=$installDir" `
            -Wait `
            -PassThru

          if ($installProcess.ExitCode -ne 0) {
            throw "NSIS silent install failed with exit code $($installProcess.ExitCode)."
          }

          $requiredFiles = @(
            'PPB_GUI_Sandbox.exe',
            'Qt6Core.dll',
            'Qt6Gui.dll',
            'Qt6Widgets.dll',
            'Qt6Network.dll',
            'Qt6Charts.dll',
            'platforms/qwindows.dll'
          )

          foreach ($relativePath in $requiredFiles) {
            $fullPath = Join-Path $installDir $relativePath
            if (-not (Test-Path $fullPath)) {
              throw "Installed runtime is incomplete: missing $relativePath"
            }
          }

          Write-Host "Silent install verified at $installDir"

      - name: Smoke-run installed application in test mode
        shell: powershell
        run: |
          $installDir = Join-Path $env:RUNNER_TEMP 'PPB-Smoke'
          $app = Join-Path $installDir 'PPB_GUI_Sandbox.exe'

          $process = Start-Process `
            -FilePath $app `
            -ArgumentList '--test' `
            -WorkingDirectory $installDir `
            -PassThru

          Start-Sleep -Seconds 5
          $process.Refresh()

          if ($process.HasExited) {
            throw "Installed PPB exited during smoke test with code $($process.ExitCode)."
          }

          Stop-Process -Id $process.Id -Force
          Write-Host 'Installed PPB stayed alive for the smoke-test interval.'

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: PPB-Windows-Installer
          path: build/PPB-*-Windows-x86_64.exe
          if-no-files-found: error
          retention-days: 30
